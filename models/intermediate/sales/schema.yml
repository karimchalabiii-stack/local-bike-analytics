version: 2

models:
  - name: int_order_lines
    description: "Intermediate model combining orders and order items at the order-line grain."

    columns:
      - name: order_item_sk
        description: "Primary key uniquely identifying an order line."
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: "Identifier of the related order."
        data_tests:
          - not_null

      - name: product_id
        description: "Identifier of the ordered product."
        data_tests:
          - not_null

      - name: customer_id
        description: "Identifier of the customer who placed the order."
        data_tests:
          - not_null

      - name: store_id
        description: "Identifier of the store associated with the order."
        data_tests:
          - not_null

      - name: staff_id
        description: "Identifier of the staff member responsible for the order."
        data_tests:
          - not_null

      - name: quantity
        description: "Number of product units included in the order line."
        data_tests:
          - not_null

      - name: sale_unit_list_price
        description: "Unit list price recorded at the time of the sale."
        data_tests:
          - not_null

      - name: discount_rate
        description: "Discount rate applied to the order line."
        data_tests:
          - not_null