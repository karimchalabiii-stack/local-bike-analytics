version: 2

models:
  - name: fct_sales
    description: "Sales fact table at the order-line grain, containing revenue and discount metrics."

    columns:
      - name: sales_line_sk
        description: "Primary key uniquely identifying an order line."
        data_tests:
          - unique
          - not_null

      - name: order_id
        description: "Identifier of the related order."
        data_tests:
          - not_null

      - name: item_id
        description: "Identifier of the line item within the order."
        data_tests:
          - not_null

      - name: product_id
        description: "Foreign key referencing the sold product."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id

      - name: customer_id
        description: "Foreign key referencing the customer who placed the order."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id


      - name: store_id
        description: "Foreign key referencing the store associated with the sale."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_stores')
                field: store_id

      - name: staff_id
        description: "Foreign key referencing the staff member responsible for the sale."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_staffs')
                field: staff_id

      - name: order_status
        description: "Lifecycle status of the related order."
        data_tests:
          - not_null

      - name: order_date
        description: "Date on which the order was placed."
        data_tests:
          - not_null

      - name: required_date
        description: "Date by which the order was expected to be fulfilled."

      - name: shipped_date
        description: "Date on which the order was shipped. Can be null for unshipped orders."

      - name: quantity
        description: "Number of product units sold."
        data_tests:
          - not_null

      - name: sale_unit_list_price
        description: "Unit list price recorded at the time of the sale."
        data_tests:
          - not_null

      - name: discount_rate
        description: "Discount rate applied to the sales line, expressed between 0 and 1."
        data_tests:
          - not_null

      - name: discount_amount
        description: "Monetary value of the discount applied to the sales line."
        data_tests:
          - not_null

      - name: net_revenue
        description: "Revenue generated by the sales line after discounts."
        data_tests:
          - not_null